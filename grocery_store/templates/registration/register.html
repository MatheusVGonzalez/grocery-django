{% extends 'master.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Register New Account</h2>

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="{{ form.fname.id_for_label }}" class="form-label">First Name</label>
                {{ form.fname }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.lname.id_for_label }}" class="form-label">Last Name</label>
                {{ form.lname }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.uname.id_for_label }}" class="form-label">Username</label>
                {{ form.uname }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                {{ form.email }}
            </div>
            
            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                {{ form.password }}
            </div>
            
            <button type="submit" class="btn ">Create Account</button>
            <a href="{% url 'login' %}" class="btn">Already have account?</a>
        </form>
    </div>
</div>

{% endblock %}
