{% extends 'master.html' %}

{% block title %}Customer{% endblock %}

{% block content %}
<h2>Add to Basket</h2>

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
        <li class="breadcrumb-item"><a href="{% url 'basket' %}">My Basket</a></li>
        <li class="breadcrumb-item active">Add to Basket</li>
    </ol>
</nav>

<form method="post">
    {% csrf_token %}
    
    <div class="table-responsive">
        <table class="table table-striped table-hover table-borderless align-middle">
            <thead class="table-light">
                <tr>
                    <th>Field</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                <tr>
                    <td>Select Product</td>
                    <td>
                        {{ form.product }}
                    </td>
                </tr>
                <tr>
                    <td>Quantity</td>
                    <td>
                        {{ form.quantity }}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>    
    <div class="mt-3">
        <button type="submit" class="btn">Add to Basket</button>
        <a href="{% url 'basket' %}" class="btn">Back to Basket</a>
        <a href="{% url 'products' %}" class="btn">Browse Products</a>
    </div>
</form>

{% endblock %}
